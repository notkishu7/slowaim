
name: Build Slow Aim Mod

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle 9.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2'

      - name: Extract project
        run: |
          unzip slowaim-fabric-1.21.11.zip -d source

      - name: Prepare resources
        run: |
          mkdir -p source/slowaim/src/main/resources
          cp source/slowaim/src/client/resources/* source/slowaim/src/main/resources/

      - name: Build Minecraft mod
        run: gradle -p source/slowaim build

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: SlowAim-Mod
          path: source/slowaim/build/libs/slowaim-*.jar
          if-no-files-found: error
